# feature config
feat:
  feat_type: mel
  sampling_rate: 44100 # 48000
  frame_size_ms: 50
  frame_shift_ms: 12.5
  feat_dim: 40 # 80
  min_freq: 3000
  feat_mean_norm: True # Apply the mean normalization on the feature (default in cmvn of kaldi) at the audio level, not needed when a batch norm layer exists.

# data config
info_json: "data/mit_data/info.json" # e.g., {'id': {'wav': wav_path, 'id': id}, 'id2': {'wav': wav_path2, 'id': id2}}
division_yaml: "conf/data/division.yaml" # Lists of wave ids ([pair1_first, pair1_second, pair2_first, pair2_second, ...]) for training, development, and test sets

# dict config
token2id_yaml: "conf/dict/token2id_marmoset.yaml"

# chunk config
train_chunk_size_ms: 500
train_chunk_shift_ms: 150
test_chunk_size_ms: 500
test_chunk_shift_ms: 400
